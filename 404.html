<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>404 · Meridian CG</title>
  <link rel="icon" type="image/jpeg" href="images/hero 1.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===== WARM STONE CHARCOAL + BURNT ORANGE PALETTE ===== */
    :root {
      --bg-primary: #faf8f6;
      --bg-secondary: #f5f5f4;
      --text-primary: #1c1917;
      --text-secondary: #57534e;
      --highlight: #ea580c;
      --highlight-dark: #c2410c;
      --accent-soft: #ffedd5;
      --border-color: #e7e5e4;
      --transition: 0.3s ease;
    }
    [data-theme="dark"] {
      --bg-primary: #0c0a09;
      --bg-secondary: #1c1917;
      --text-primary: #f5f5f4;
      --text-secondary: #a8a29e;
      --highlight: #ea580c;
      --highlight-dark: #c2410c;
      --accent-soft: #2c1608;
      --border-color: #292524;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      transition: background var(--transition), color var(--transition);
      position: relative;
      overflow: hidden;
    }

    /* Subtle background pattern to tie into the site */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(28, 25, 23, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(28, 25, 23, 0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(circle at 50% 50%, black 20%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }
    [data-theme="dark"] body::before {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    }

    .error-container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 620px;
      width: 100%;
      margin: 0 auto;
    }

    .error-code {
      font-size: clamp(6rem, 18vw, 10rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.05em;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.02em;
      margin-bottom: 2rem;
    }
    .error-code .digit {
      color: var(--text-primary);
    }
    .error-code .zero {
      color: transparent;
      -webkit-text-stroke: 5px var(--highlight);
      /* Fallback for browsers that don't support text-stroke */
      position: relative;
    }
    @supports not (-webkit-text-stroke: 1px black) {
      .error-code .zero {
        color: var(--highlight);
      }
    }

    .error-title {
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 1.2rem;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .error-text {
      font-size: 1.05rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 2.5rem;
      padding: 0 1rem;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #1c1917;
      color: #ffffff;
      padding: 1rem 2.4rem;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      transition: 0.28s ease;
      box-shadow: 0 10px 30px rgba(28, 25, 23, 0.18);
    }
    [data-theme="dark"] .btn-home {
      background: var(--highlight);
      box-shadow: 0 10px 30px rgba(234, 88, 12, 0.3);
    }
    .btn-home:hover {
      background: #0c0a09;
      transform: translateY(-3px);
      box-shadow: 0 16px 38px rgba(28, 25, 23, 0.3);
    }
    [data-theme="dark"] .btn-home:hover {
      background: var(--highlight-dark);
      box-shadow: 0 16px 38px rgba(234, 88, 12, 0.45);
    }
    .btn-home i {
      font-size: 0.9rem;
      transition: transform 0.25s ease;
    }
    .btn-home:hover i {
      transform: translateX(-4px);
    }

    @media (max-width: 767px) {
      body { padding: 1.5rem 1rem; }
      .error-code { margin-bottom: 1.5rem; }
      .error-code .zero { -webkit-text-stroke-width: 4px; }
      .error-text { font-size: 0.95rem; margin-bottom: 2rem; }
      .btn-home { padding: 0.9rem 2rem; font-size: 0.92rem; }
    }
  </style>
</head>
<body>

  <div class="error-container">
    <div class="error-code">
      <span class="digit">4</span>
      <span class="zero">0</span>
      <span class="digit">4</span>
    </div>

    <h1 class="error-title">Looks Like This Engagement Doesn't Exist.</h1>
    
    <p class="error-text">
      The page you're looking for has been moved, renamed, or never existed. Don't worry — we can get you back on track. Let's head home and find what you need.
    </p>

    <a href="index.html" class="btn-home">
      <i class="fas fa-arrow-left"></i> Back To Home
    </a>
  </div>

  <script>
    // Apply saved theme on load
    window.addEventListener('load', function() {
      const savedTheme = localStorage.getItem('meridian-theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    });
  </script>
</body>
</html>
